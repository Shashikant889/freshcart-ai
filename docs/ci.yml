name: FreshCart AI Continuous Integration & Quality Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Multi-Tier Verification & Quality Tests (Node 20.x)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Seed Database & Synthetics
        run: npm run seed

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Start Server in Background
        run: |
          node server.js &
          sleep 3

      - name: Run Playwright Real-Browser E2E Automation Suite
        run: npm run test:playwright

      - name: Run Complete Full-Stack Test Matrix (244 Assertions)
        run: npm run test:all

  docker-build:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Web Application Docker Image
        run: docker build -t freshcart-web:latest .

      - name: Build Python AI Microservice Docker Image
        run: docker build -f ml/Dockerfile.ai -t freshcart-ai:latest .
