<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="iceCreamBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/><stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
    <linearGradient id="tubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/><stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <filter id="shadowIce" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="28" fill="url(#iceCreamBg)"/>
  <g filter="url(#shadowIce)">
    <!-- Scoops of Ice Cream -->
    <circle cx="85" cy="80" r="26" fill="#fef08a"/>
    <circle cx="115" cy="80" r="26" fill="#f472b6"/>
    <circle cx="100" cy="62" r="24" fill="#fed7aa"/>
    <!-- Cherry on top -->
    <circle cx="100" cy="42" r="8" fill="#e11d48"/>
    <path d="M102 36 Q115 26 120 28" stroke="#9f1239" stroke-width="2.5" fill="none"/>
    <!-- Tub Container -->
    <path d="M58 92 L142 92 L132 155 L68 155 Z" fill="url(#tubGrad)"/>
    <rect x="54" y="88" width="92" height="10" rx="4" fill="#be185d"/>
    <!-- Tub Label -->
    <rect x="72" y="112" width="56" height="24" rx="6" fill="#ffffff"/>
    <text x="100" y="128" font-size="10" font-weight="800" fill="#db2777" text-anchor="middle" font-family="sans-serif">ICE CREAM</text>
  </g>
</svg>
